# Muestra para el análisis exploratorio de D39.
# Rellena "url" con enlaces reales antes de correr `python -m scraper.ingest`.
#
# IMPORTANTE: cada partido es un elemento de LISTA — tiene que empezar con "- ".
# Sin el guion, YAML lo trata como una clave de mapa y, si repites "url:" varias
# veces, solo se queda con la última (pierde las demás en silencio).
#
# Sugerencia de D39: una jornada completa (~10 partidos) + una muestra
# estratificada con expulsión, penalti(s) y VAR, para cubrir el long tail
# de match_comment_kind antes de diseñar silver.
#
# "slug" es la clave natural en bronze (partido_natural_key): usa algo estable
# y legible, p. ej. "j28-alaves-villarreal".

partidos:
  # --- Jornada 28 completa ---
  - slug: j28-alaves-villarreal
