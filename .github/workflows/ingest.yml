name: Captura semanal

# D32: workflow programado — captura incremental de la temporada en curso.
# discover_recent (D30/D32) decide qué jornadas mirar por FECHA (últimos 14
# días), no por número de jornada, para no perder partidos aplazados; el
# status de cada partido decide qué se considera ya jugado.
#
# Martes 06:00 UTC: da margen a los partidos del lunes noche y a que
# LaLiga.com termine de marcar el status como FullTime.

on:
  schedule:
    - cron: "0 6 * * 2"
  workflow_dispatch: {}

jobs:
  captura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del scraper
        run: pip install -r requirements.txt

      - name: Ingesta de partidos recientes
        run: python -m scraper.ingest --recientes --only-played
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Instalar dbt
        run: pip install -r dbt/requirements.txt

      - name: dbt build (silver + gold + tests)
        working-directory: dbt
        run: dbt build --profiles-dir .
        env:
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          PGUSER: ${{ secrets.PGUSER }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGSSLMODE: ${{ secrets.PGSSLMODE }}
